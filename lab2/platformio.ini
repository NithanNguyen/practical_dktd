; Buoi 2 - Thuc hanh ve nha: doc IMU BNO055 (GY-BNO055) qua I2C, loc Moving Average
; va Complementary Filter, xuat raw + da loc ra Serial de ghi CSV.
; Board: NodeMCU-32S (ID "nodemcu-32s" theo tai lieu PlatformIO)
;
;   pio run -e i2c_scan   -t upload   buoc 1: quet bus I2C, tim dia chi BNO055
;   pio run -e imu_logger -t upload   buoc 2: firmware ghi du lieu chinh (mac dinh)

[platformio]
default_envs = imu_logger

[env]
platform = espressif32
board = nodemcu-32s
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags = -Wall

[env:imu_logger]
build_src_filter = +<imu_logger/>
; Chi dung thu vien de khoi tao (reset, chon che do ACCGYRO);
; du lieu doc truc tiep bang Wire (1 lan doc lien tiep 18 byte).
lib_deps = adafruit/Adafruit BNO055@^1.6.4
; ~135 byte/dong x 100 Hz = ~13.5 kB/s > 115200 baud (~11.5 kB/s) -> phai tang baud.
; Neu Serial loi ky tu, doi ca 2 noi (o day va SERIAL_BAUD trong main.cpp) xuong 230400.
monitor_speed = 460800

[env:i2c_scan]
build_src_filter = +<i2c_scan/>
monitor_speed = 115200
