; Lab 4 CE212 - Nhanh Robot (thuc hanh ve nha):
; dao chieu + dung khan cap dong co DC theo nut nhan, do thoi gian dap ung dung khan.
; Board: ESP32-DevKitC-32D (module ESP32-WROOM-32D).
; PlatformIO khong co ID rieng cho DevKitC dong ESP32 nen dung esp32dev (giong repo eezybot_mk2_robot).
;
;   pio run -t upload        bien dich + nap
;   pio device monitor       xem Serial (go "help")

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = -Wall
