; Buoi 1 - Thuc hanh ve nha: lay mau ADC 100 Hz bang Timer ngat phan cung
; Board: NodeMCU-32S (ID "nodemcu-32s" theo tai lieu PlatformIO)

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino

monitor_speed = 115200
; Neu co nhieu cong serial, bo comment va sua dung ten cong:
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
